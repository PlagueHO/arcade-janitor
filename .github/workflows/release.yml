name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  build:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
      - name: Remove unused Homebrew tap
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tap_dir="$(brew --repository)/Library/Taps/aws/homebrew-tap"
          if [[ -d "$tap_dir" ]]; then
            brew untap aws/tap
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Verify semantic version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vX.Y.Z, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: cargo build -p arcadejanitor-cli -p arcadejanitor-mcp --release
      - name: Package Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          archive="arcadejanitor-${GITHUB_REF_NAME}-${PLATFORM}.tar.gz"
          mkdir -p package
          cp target/release/arcadejanitor target/release/arcadejanitor-mcp package/
          tar -czf "$archive" -C package arcadejanitor arcadejanitor-mcp
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          $archive = "arcadejanitor-$env:GITHUB_REF_NAME-$env:PLATFORM.zip"
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item target/release/arcadejanitor.exe, target/release/arcadejanitor-mcp.exe -Destination package
          Compress-Archive -Path package/* -DestinationPath $archive
      - uses: actions/upload-artifact@v7
        with:
          name: arcadejanitor-${{ matrix.platform }}
          path: arcadejanitor-${{ github.ref_name }}-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: arcadejanitor-*
          merge-multiple: true
      - name: Extract changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if grep -Fxq "## [$version]" CHANGELOG.md; then
            heading="## [$version]"
          else
            heading="## [Unreleased]"
          fi
          awk -v heading="$heading" '
            $0 == heading { found=1; next }
            found && $0 ~ /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md has no entry for [$version] or [Unreleased]" >&2
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* \
          --title "ArcadeJanitor ${{ github.ref_name }}" \
          --notes-file release-notes.md
