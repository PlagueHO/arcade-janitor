name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    outputs:
      identity: ${{ steps.identity.outputs.identity }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
      - name: Remove unused Homebrew tap
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tap_dir="$(brew --repository)/Library/Taps/aws/homebrew-tap"
          if [[ -d "$tap_dir" ]]; then
            brew untap aws/tap
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
      - name: Check workspace version and package identity
        id: identity
        shell: pwsh
        run: |
          $identity = ./scripts/get-package-identity.ps1
          "identity=$identity" >> $env:GITHUB_OUTPUT
          "PACKAGE_ID=$identity" >> $env:GITHUB_ENV
      - name: Test release validation failures
        shell: pwsh
        run: ./scripts/test-release-checks.ps1
      - run: cargo build -p arcadejanitor-cli -p arcadejanitor-mcp --release --locked
      - name: Package Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          archive="arcadejanitor-${PACKAGE_ID}-${PLATFORM}.tar.gz"
          mkdir -p dist
          mkdir -p package
          cp target/release/arcadejanitor target/release/arcadejanitor-mcp package/
          tar -czf "dist/$archive" -C package arcadejanitor arcadejanitor-mcp
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          $archive = "arcadejanitor-$env:PACKAGE_ID-$env:PLATFORM.zip"
          New-Item -ItemType Directory -Path dist | Out-Null
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item target/release/arcadejanitor.exe, target/release/arcadejanitor-mcp.exe -Destination package
          Compress-Archive -Path package/* -DestinationPath "dist/$archive"
      - name: Generate and validate package checksum
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          $archive = Get-ChildItem -LiteralPath dist -File
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Set-Content -LiteralPath "$($archive.FullName).sha256" -Encoding ascii
          ./scripts/check-release-assets.ps1 -Directory dist -Identity $env:PACKAGE_ID -Platform $env:PLATFORM
      - name: Test extracted Unix package
        if: runner.os != 'Windows'
        timeout-minutes: 15
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCADEJANITOR_RELEASE_PACKAGE_DIR: ${{ runner.temp }}/release-package
        run: |
          set -euo pipefail
          mkdir "$ARCADEJANITOR_RELEASE_PACKAGE_DIR"
          tar -xzf "dist/arcadejanitor-${PACKAGE_ID}-${PLATFORM}.tar.gz" -C "$ARCADEJANITOR_RELEASE_PACKAGE_DIR"
          cargo test -p arcadejanitor-mcp --test release_package --locked extracted_release_package -- --ignored --exact --nocapture
      - name: Test extracted Windows package
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCADEJANITOR_RELEASE_PACKAGE_DIR: ${{ runner.temp }}\release-package
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:ARCADEJANITOR_RELEASE_PACKAGE_DIR | Out-Null
          Expand-Archive -Path "dist/arcadejanitor-$env:PACKAGE_ID-$env:PLATFORM.zip" -DestinationPath $env:ARCADEJANITOR_RELEASE_PACKAGE_DIR
          cargo test -p arcadejanitor-mcp --test release_package --locked extracted_release_package -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove extracted Unix package
        if: always() && runner.os != 'Windows'
        shell: bash
        env:
          ARCADEJANITOR_RELEASE_PACKAGE_DIR: ${{ runner.temp }}/release-package
        run: rm -rf -- "$ARCADEJANITOR_RELEASE_PACKAGE_DIR"
      - name: Remove extracted Windows package
        if: always() && runner.os == 'Windows'
        shell: pwsh
        env:
          ARCADEJANITOR_RELEASE_PACKAGE_DIR: ${{ runner.temp }}\release-package
        run: |
          if (Test-Path -LiteralPath $env:ARCADEJANITOR_RELEASE_PACKAGE_DIR) {
            Remove-Item -LiteralPath $env:ARCADEJANITOR_RELEASE_PACKAGE_DIR -Recurse -Force
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arcadejanitor-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  provenance:
    name: Attest and verify package assets
    if: github.repository == 'PlagueHO/arcade-janitor' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE_ID: ${{ needs.build.outputs.identity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: arcadejanitor-*
          merge-multiple: true
      - name: Validate final assets
        id: assets
        run: |
          $assets = @(./scripts/check-release-assets.ps1 -Directory dist -Identity $env:PACKAGE_ID)
          "subjects<<RELEASE_SUBJECTS" >> $env:GITHUB_OUTPUT
          $assets >> $env:GITHUB_OUTPUT
          "RELEASE_SUBJECTS" >> $env:GITHUB_OUTPUT
      - name: Attest archives and checksum sidecars
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.subjects }}
          create-storage-record: false
      - name: Verify signed provenance and controlled rejections
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          New-Item -ItemType Directory -Path provenance-evidence | Out-Null
          Copy-Item -LiteralPath $env:ATTESTATION_BUNDLE -Destination provenance-evidence/attestation.json
          ./scripts/verify-release-provenance.ps1 -Directory dist -Identity $env:PACKAGE_ID -SourceCommit $env:GITHUB_SHA -SourceRef $env:GITHUB_REF -Bundle provenance-evidence/attestation.json
          $asset = @(./scripts/check-release-assets.ps1 -Directory dist -Identity $env:PACKAGE_ID)[0]
          ./scripts/test-release-provenance.ps1 -Artifact $asset -SourceCommit $env:GITHUB_SHA -SourceRef $env:GITHUB_REF -Bundle provenance-evidence/attestation.json
          'Signed provenance and rejection checks passed. This is not publisher signing or notarization.' >> $env:GITHUB_STEP_SUMMARY
      - name: Retain signed provenance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-provenance-evidence
          path: provenance-evidence/attestation.json
          if-no-files-found: error

  draft:
    name: Prepare draft GitHub Release
    if: github.repository == 'PlagueHO/arcade-janitor' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: arcadejanitor-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-provenance-evidence
          path: provenance-evidence
      - name: Verify existing tag and final provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ID: ${{ needs.build.outputs.identity }}
        run: |
          $objectText = gh api "repos/PlagueHO/arcade-janitor/git/ref/tags/$env:PACKAGE_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the existing release tag.' }
          $object = ($objectText | ConvertFrom-Json).object
          for ($depth = 0; $object.type -ceq 'tag' -and $depth -lt 10; $depth++) {
            $tagText = gh api "repos/PlagueHO/arcade-janitor/git/tags/$($object.sha)"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read the annotated release tag.' }
            $object = ($tagText | ConvertFrom-Json).object
          }
          if ($object.type -cne 'commit' -or $object.sha -cne $env:GITHUB_SHA) {
            throw 'The existing tag must identify this build commit.'
          }
          ./scripts/verify-release-provenance.ps1 -Directory dist -Identity $env:PACKAGE_ID -SourceCommit $env:GITHUB_SHA -SourceRef $env:GITHUB_REF -Bundle provenance-evidence/attestation.json
      - name: Extract changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if grep -Fxq "## [$version]" CHANGELOG.md; then
            heading="## [$version]"
          else
            heading="## [Unreleased]"
          fi
          awk -v heading="$heading" '
            $0 == heading { found=1; next }
            found && $0 ~ /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md has no entry for [$version] or [Unreleased]" >&2
            exit 1
          fi
      - name: Prepare draft for separate maintainer publication approval
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ID: ${{ needs.build.outputs.identity }}
        run: |
          $assets = @(./scripts/check-release-assets.ps1 -Directory dist -Identity $env:PACKAGE_ID)
          gh release create $env:PACKAGE_ID @assets --verify-tag --draft --title "ArcadeJanitor $env:PACKAGE_ID" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed; no existing release will be modified.' }
