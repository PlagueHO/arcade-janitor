[workspace]
members = [
    "arcadejanitor-core",
    "arcadejanitor-cli",
    "arcadejanitor-mcp",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/PlagueHO/arcade-janitor"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
chrono = "0.4.44"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.0"
dirs-next = "2.0.0"
indicatif = "0.18.4"
ini = "1.3.0"
mcp-server-rs = "0.1.0"
mcp-core-rs = "0.1.0"
mcp-error-rs = "0.1.0"
quick-xml = "0.42.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
