[workspace]
members = [
    "src/arcadejanitor-core",
    "src/arcadejanitor-cli",
    "src/arcadejanitor-mcp",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/PlagueHO/arcade-janitor"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
clap_complete = "4.6.12"
dirs-next = "2.0.0"
ini = "2.0.0"
jiff = "1.0.1"
rmcp = { version = "3.11.0", default-features = false, features = ["server"] }
quick-xml = "0.42.0"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
